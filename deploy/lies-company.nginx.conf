server {
    listen 80 default_server;
    server_name lies-company.zray.cc 101.42.170.129;
    server_tokens off;
    client_max_body_size 256k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 302 https://lies-company.zray.cc$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lies-company.zray.cc;
    server_tokens off;
    client_max_body_size 256k;

    ssl_certificate /etc/letsencrypt/live/lies-company.zray.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lies-company.zray.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 210s;
        proxy_send_timeout 30s;
    }
}
